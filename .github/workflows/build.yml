name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Product = the WebView UI (Holy Shifter WV) on macOS + Windows. The legacy Visage
# (GPU) builds are intentionally NOT built here to save runner minutes.

jobs:
  dsp-tests:
    # Pure C++ DSP unit tests — fast, no audio host required. Gates merges.
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure (tests on)
      working-directory: plugin
      run: |
        cmake -B build-tests \
          -DCMAKE_BUILD_TYPE=Release \
          -DHOLY_SHIFTER_BUILD_TESTS=ON

    - name: Build dsp_tests
      working-directory: plugin
      run: cmake --build build-tests --target dsp_tests --config Release --parallel

    - name: Run dsp_tests
      working-directory: plugin
      run: ctest --test-dir build-tests --output-on-failure

  # macOS WebView build — the shipping juce::WebBrowserComponent (WKWebView) UI as
  # VST3 + AU ("Holy Shifter WV").
  build-macos-webview:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake (WebView)
      working-directory: plugin
      run: |
        cmake -B build-wv \
          -DCMAKE_BUILD_TYPE=Release \
          -DHOLY_SHIFTER_USE_WEBVIEW=ON \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

    - name: Build (WebView)
      working-directory: plugin
      run: cmake --build build-wv --config Release --parallel

    - name: Package VST3 + AU
      working-directory: plugin
      run: |
        mkdir -p artifacts/VST3 artifacts/AU
        cp -R build-wv/FrequencyShifter_artefacts/Release/VST3/*.vst3 artifacts/VST3/ || true
        cp -R build-wv/FrequencyShifter_artefacts/Release/AU/*.component artifacts/AU/ || true

    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: HolyShifter-WV-macOS-VST3
        path: plugin/artifacts/VST3/
        if-no-files-found: warn

    - name: Upload AU
      uses: actions/upload-artifact@v4
      with:
        name: HolyShifter-WV-macOS-AU
        path: plugin/artifacts/AU/
        if-no-files-found: warn

  # Windows WebView build — compiles the juce::WebBrowserComponent (WebView2 / Edge Chromium)
  # UI, packages it into an Inno Setup installer (VST3 only), and (when a signing cert is
  # configured) code-signs the payload + installer. Uploads the installer as the deliverable.
  build-windows-webview:
    runs-on: windows-latest

    # Code signing is OPTIONAL: these come from repo secrets and, when empty, every signing
    # step below is skipped and the installer ships unsigned. To enable signing later, add
    # secrets WINDOWS_CERT_PFX_BASE64 (base64 of a .pfx) and WINDOWS_CERT_PASSWORD.
    env:
      WIN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Install WebView2 SDK (NuGet)
      shell: pwsh
      run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory ${{ github.workspace }}/nuget

    - name: Configure CMake (WebView)
      working-directory: plugin
      run: >
        cmake -B build-wv
        -DCMAKE_BUILD_TYPE=Release
        -DHOLY_SHIFTER_USE_WEBVIEW=ON
        -DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ github.workspace }}/nuget

    - name: Build (WebView)
      working-directory: plugin
      run: cmake --build build-wv --config Release --parallel

    - name: List build artifacts
      working-directory: plugin
      shell: pwsh
      run: Get-ChildItem -Recurse -Directory -Filter *.vst3 build-wv | ForEach-Object { $_.FullName }

    - name: Extract version
      shell: pwsh
      run: |
        $m = Select-String -Path 'plugin/CMakeLists.txt' -Pattern 'project\s*\(\s*FrequencyShifter\s+VERSION\s+([0-9.]+)'
        $ver = $m.Matches[0].Groups[1].Value
        "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "App version: $ver"

    # ---- Optional code signing (skipped unless the cert secrets are set) ------------------
    - name: Prepare code signing
      if: env.WIN_CERT_PFX_BASE64 != ''
      shell: pwsh
      run: |
        $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
        "CODESIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $st) { throw "signtool.exe not found on the runner" }
        "SIGNTOOL=$($st.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "Using signtool: $($st.FullName)"

    - name: Sign VST3 payload
      if: env.WIN_CERT_PFX_BASE64 != ''
      shell: pwsh
      working-directory: plugin
      run: |
        Get-ChildItem -Recurse -Filter *.vst3 build-wv/FrequencyShifter_artefacts/Release/VST3 |
          Where-Object { -not $_.PSIsContainer } | ForEach-Object {
            & $env:SIGNTOOL sign /f $env:CODESIGN_PFX /p $env:WIN_CERT_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($_.FullName)" }
          }

    # ---- Build the installer --------------------------------------------------------------
    - name: Locate Inno Setup
      shell: pwsh
      run: |
        # windows-latest ships Inno Setup preinstalled; fall back to choco if a future image drops it.
        $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
        if (-not $iscc) {
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        }
        if (-not $iscc) {
          choco install innosetup -y --no-progress
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        }
        if (-not $iscc) { throw "ISCC.exe not found" }
        "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "ISCC: $iscc"

    - name: Build installer (Inno Setup)
      shell: pwsh
      run: |
        $payload = "${{ github.workspace }}\plugin\build-wv\FrequencyShifter_artefacts\Release\VST3"
        & "$env:ISCC" "/DAppVersion=$env:APP_VERSION" "/DPayloadDir=$payload" "plugin\installer\windows\HolyShifterWV.iss"
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
        Get-ChildItem "plugin\installer\windows\Output"

    - name: Sign installer
      if: env.WIN_CERT_PFX_BASE64 != ''
      shell: pwsh
      run: |
        Get-ChildItem "plugin\installer\windows\Output\*.exe" | ForEach-Object {
          & $env:SIGNTOOL sign /f $env:CODESIGN_PFX /p $env:WIN_CERT_PASSWORD /fd sha256 `
            /tr http://timestamp.digicert.com /td sha256 $_.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed on installer" }
        }

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: HolyShifterWV-Windows-Installer
        path: plugin/installer/windows/Output/*.exe
        if-no-files-found: error

    # Raw VST3 kept as a secondary artifact for side-load debugging.
    - name: Package VST3 (raw)
      working-directory: plugin
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        Compress-Archive -Path "build-wv/FrequencyShifter_artefacts/Release/VST3/*" -DestinationPath "artifacts/HolyShifter-WV-Windows-VST3.zip" -Force

    - name: Upload VST3 (raw)
      uses: actions/upload-artifact@v4
      with:
        name: HolyShifter-WV-Windows-VST3
        path: plugin/artifacts/*.zip
        if-no-files-found: warn

  # Collect the macOS WebView artifacts into a release package on main-branch pushes.
  package:
    needs: [build-macos-webview, dsp-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Download macOS WebView VST3
      uses: actions/download-artifact@v4
      with:
        name: HolyShifter-WV-macOS-VST3
        path: release/macOS-VST3

    - name: Download macOS WebView AU
      uses: actions/download-artifact@v4
      with:
        name: HolyShifter-WV-macOS-AU
        path: release/macOS-AU

    - name: Create release archives
      run: |
        cd release
        zip -r HolyShifterWV-macOS-VST3.zip macOS-VST3/
        zip -r HolyShifterWV-macOS-AU.zip macOS-AU/

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: HolyShifterWV-macOS
        path: release/*.zip
