name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dsp-tests:
    # Pure C++ DSP unit tests — fast, no audio host required.
    # Runs in parallel with the plugin build; both jobs gate merges.
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure (tests on)
      working-directory: plugin
      run: |
        cmake -B build-tests \
          -DCMAKE_BUILD_TYPE=Release \
          -DHOLY_SHIFTER_BUILD_TESTS=ON

    - name: Build dsp_tests
      working-directory: plugin
      run: cmake --build build-tests --target dsp_tests --config Release --parallel

    - name: Run dsp_tests
      working-directory: plugin
      run: ctest --test-dir build-tests --output-on-failure

  build-macos:
    runs-on: macos-14
    timeout-minutes: 45   # backstop in case validation hangs on the headless runner

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      working-directory: plugin
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

    - name: Build
      working-directory: plugin
      run: cmake --build build --config Release --parallel

    - name: List build artifacts
      working-directory: plugin
      run: |
        echo "=== VST3 ==="
        find build -name "*.vst3" -type d
        echo "=== AU ==="
        find build -name "*.component" -type d

    # ---- Package + upload BEFORE validation so binaries are always produced ---
    # pluginval/pedalboard currently hang at plugin load on the headless runner
    # (Visage GPU init — a CI-environment limitation, not a build failure), so
    # they run afterwards and are non-blocking. Artifacts must be uploaded first.

    - name: Package VST3
      working-directory: plugin
      run: |
        mkdir -p artifacts/VST3
        cp -R build/FrequencyShifter_artefacts/Release/VST3/*.vst3 artifacts/VST3/ || true

    - name: Package AU
      working-directory: plugin
      run: |
        mkdir -p artifacts/AU
        cp -R build/FrequencyShifter_artefacts/Release/AU/*.component artifacts/AU/ || true

    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: FrequencyShifter-macOS-VST3
        path: plugin/artifacts/VST3/
        if-no-files-found: warn

    - name: Upload AU
      uses: actions/upload-artifact@v4
      with:
        name: FrequencyShifter-macOS-AU
        path: plugin/artifacts/AU/
        if-no-files-found: warn

    # ---- Validation (non-blocking) -------------------------------------------
    # Kept for signal in the logs, but continue-on-error + step timeouts so a
    # headless-CI hang can't gate the build. Revisit once the runner can host
    # the Visage editor (pluginval timed out at plugin load).

    - name: Download pluginval
      continue-on-error: true
      run: |
        curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
        unzip -q pluginval.zip
        chmod +x pluginval.app/Contents/MacOS/pluginval

    - name: Run pluginval on VST3
      continue-on-error: true
      timeout-minutes: 5
      run: |
        VST3="$(find plugin/build -name 'Holy Shifter.vst3' -type d | head -1)"
        echo "Validating: $VST3"
        ./pluginval.app/Contents/MacOS/pluginval \
          --strictness-level 8 \
          --validate-in-process \
          --skip-gui-tests \
          --validate "$VST3"

    - name: Run pluginval on AU
      continue-on-error: true
      timeout-minutes: 5
      run: |
        AU="$(find plugin/build -name 'Holy Shifter.component' -type d | head -1)"
        echo "Validating: $AU"
        ./pluginval.app/Contents/MacOS/pluginval \
          --strictness-level 8 \
          --validate-in-process \
          --skip-gui-tests \
          --validate "$AU"

    # ---- Pedalboard golden-audio tests (non-blocking) ------------------------
    # Uses the env var HOLY_SHIFTER_VST3 added in conftest.py so the test
    # suite finds the freshly-built artifact instead of the system path.

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python deps
      run: pip install pedalboard numpy scipy pytest

    - name: Run pedalboard tests
      continue-on-error: true
      timeout-minutes: 10
      env:
        HOLY_SHIFTER_VST3: ${{ github.workspace }}/plugin/build/FrequencyShifter_artefacts/Release/VST3/Holy Shifter.vst3
      run: |
        cd tests
        pytest -v --tb=short

  # Windows build — verifies the Visage/bgfx D3D11 backend compiles on windows-latest.
  # VST3 + Standalone build here (AU/AUv3 are macOS-only and skipped by JUCE).
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      working-directory: plugin
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      working-directory: plugin
      run: cmake --build build --config Release --parallel

    - name: List build artifacts
      working-directory: plugin
      shell: pwsh
      run: |
        Write-Host "=== VST3 ==="
        Get-ChildItem -Recurse -Directory -Filter *.vst3 build | ForEach-Object { $_.FullName }

    - name: Package VST3
      working-directory: plugin
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        Compress-Archive -Path "build/FrequencyShifter_artefacts/Release/VST3/*" -DestinationPath "artifacts/FrequencyShifter-Windows-VST3.zip" -Force

    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: FrequencyShifter-Windows-VST3
        path: plugin/artifacts/*.zip
        if-no-files-found: warn

  # Windows WebView build — verifies the juce::WebBrowserComponent (WebView2 / Edge Chromium)
  # UI compiles + links on Windows. Builds the HOLY_SHIFTER_USE_WEBVIEW variant ("Holy Shifter
  # WV") with the Microsoft.Web.WebView2 NuGet (statically-linked loader). Non-gating.
  build-windows-webview:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Install WebView2 SDK (NuGet)
      shell: pwsh
      run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory ${{ github.workspace }}/nuget

    - name: Configure CMake (WebView)
      working-directory: plugin
      run: >
        cmake -B build-wv
        -DCMAKE_BUILD_TYPE=Release
        -DHOLY_SHIFTER_USE_WEBVIEW=ON
        -DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ github.workspace }}/nuget

    - name: Build (WebView)
      working-directory: plugin
      run: cmake --build build-wv --config Release --parallel

    - name: List build artifacts
      working-directory: plugin
      shell: pwsh
      run: Get-ChildItem -Recurse -Directory -Filter *.vst3 build-wv | ForEach-Object { $_.FullName }

    - name: Package VST3
      working-directory: plugin
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        Compress-Archive -Path "build-wv/FrequencyShifter_artefacts/Release/VST3/*" -DestinationPath "artifacts/HolyShifter-WV-Windows-VST3.zip" -Force

    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: HolyShifter-WV-Windows-VST3
        path: plugin/artifacts/*.zip
        if-no-files-found: warn

  # macOS WebView build — the ported juce::WebBrowserComponent (WKWebView) UI as VST3 + AU
  # ("Holy Shifter WV"), so the WebView variant is downloadable for macOS too. Non-gating.
  build-macos-webview:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake (WebView)
      working-directory: plugin
      run: |
        cmake -B build-wv \
          -DCMAKE_BUILD_TYPE=Release \
          -DHOLY_SHIFTER_USE_WEBVIEW=ON \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

    - name: Build (WebView)
      working-directory: plugin
      run: cmake --build build-wv --config Release --parallel

    - name: Package VST3 + AU
      working-directory: plugin
      run: |
        mkdir -p artifacts/VST3 artifacts/AU
        cp -R build-wv/FrequencyShifter_artefacts/Release/VST3/*.vst3 artifacts/VST3/ || true
        cp -R build-wv/FrequencyShifter_artefacts/Release/AU/*.component artifacts/AU/ || true

    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: HolyShifter-WV-macOS-VST3
        path: plugin/artifacts/VST3/
        if-no-files-found: warn

    - name: Upload AU
      uses: actions/upload-artifact@v4
      with:
        name: HolyShifter-WV-macOS-AU
        path: plugin/artifacts/AU/
        if-no-files-found: warn

  # Collect macOS artifacts into a release package for main-branch pushes.
  package:
    needs: [build-macos, dsp-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Download macOS VST3
      uses: actions/download-artifact@v4
      with:
        name: FrequencyShifter-macOS-VST3
        path: release/macOS-VST3

    - name: Download macOS AU
      uses: actions/download-artifact@v4
      with:
        name: FrequencyShifter-macOS-AU
        path: release/macOS-AU

    - name: Create release archives
      run: |
        cd release
        zip -r FrequencyShifter-macOS-VST3.zip macOS-VST3/
        zip -r FrequencyShifter-macOS-AU.zip macOS-AU/

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: FrequencyShifter-macOS
        path: release/*.zip
